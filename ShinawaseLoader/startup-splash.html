<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="color-scheme" content="light">
<title>Shinawase</title>
<!--
  Startup card for ShinawaseLoader. startup-splash.cjs shows this page in a
  small opaque window while ECHO boots and drives it through
  window.shinawaseSplash: start() → stage() → outro() → finish(). Open the file
  with ?demo=1 to watch the whole sequence in a browser.
-->
<style>
  :root {
    --paper: #f7f6f2;
    --ink: #1f1e1c;
    --soft: #8a867e;
    --faint: rgba(31, 30, 28, 0.12);
    --seal: #d6452a;
    --sans: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "PingFang SC", "Hiragino Sans", "Noto Sans CJK SC", system-ui, sans-serif;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--paper); }
  body {
    color: var(--ink); font-family: var(--sans); user-select: none; cursor: default;
    -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
  }
  body::after { content: ""; position: fixed; inset: 0; box-shadow: inset 0 0 0 1px rgba(31, 30, 28, 0.07); pointer-events: none; }
  body.demo { display: grid; place-items: center; background: #d9d6cf; }
  body.demo #card { position: relative; box-shadow: 0 18px 50px -24px rgba(0, 0, 0, 0.35); }

  #card { position: fixed; inset: 0; width: 560px; height: 320px; margin: auto; background: var(--paper); }
  #content { position: absolute; inset: 0; will-change: opacity, transform; }
  #mark { position: absolute; left: 56px; top: 96px; width: 268px; overflow: visible; }
  #rule { position: absolute; left: 56px; right: 56px; top: 176px; height: 1px; overflow: visible; }
  .meta {
    position: absolute; left: 56px; right: 56px; top: 192px;
    display: flex; align-items: baseline; justify-content: space-between; opacity: 0;
  }
  .caption { font: italic 400 13.5px/1 var(--serif); color: #6c6862; letter-spacing: 0.01em; }
  .version { font: 400 11px/1 var(--sans); color: var(--soft); letter-spacing: 0.06em; }
  .foot {
    position: absolute; left: 56px; right: 56px; bottom: 40px;
    display: flex; align-items: baseline; justify-content: space-between;
    font: 400 12px/1 var(--sans); color: var(--soft); letter-spacing: 0.02em; opacity: 0;
  }
  .status { position: relative; display: inline-flex; align-items: baseline; min-width: 0; white-space: nowrap; }
  .status .text { transition: opacity 0.22s ease, transform 0.22s ease; }
  .status .text.leaving { opacity: 0; transform: translateY(-3px); }
  .dots { display: inline-flex; gap: 3px; margin-left: 6px; }
  .dots i { width: 3px; height: 3px; border-radius: 50%; background: var(--soft); opacity: 0.25; animation: dot 1.4s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: 0.18s; }
  .dots i:nth-child(3) { animation-delay: 0.36s; }
  @keyframes dot { 0%, 70%, 100% { opacity: 0.25; } 35% { opacity: 1; } }
  .ready .dots { visibility: hidden; }
  .mods:empty { display: none; }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: 0.6; } }
</style>
</head>
<body>
<div id="card">
  <div id="content">
    <svg id="mark" role="img" aria-label="Shinawase"></svg>
    <svg id="rule" aria-hidden="true"></svg>
    <div class="meta"><span class="caption">a mod loader for ECHO</span><span class="version"></span></div>
    <div class="foot">
      <span class="status"><span class="text"></span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></span>
      <span class="mods"></span>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const params = new URLSearchParams(location.search);
  const demo = params.get('demo') === '1';
  const num = (key, fallback) => {
    const raw = params.get(key);
    const value = raw === null || raw === '' ? NaN : Number(raw);
    return Number.isFinite(value) ? value : fallback;
  };
  const reduced = params.get('motion') === 'reduce' || matchMedia('(prefers-reduced-motion: reduce)').matches;
  const locale = /^zh/i.test(params.get('locale') || navigator.language || '') ? 'zh' : 'en';
  const STAGES = {
    zh: { boot: '正在准备', echo: '正在启动 ECHO', ui: '正在载入界面', ready: '准备就绪' },
    en: { boot: 'Preparing', echo: 'Starting ECHO', ui: 'Loading the interface', ready: 'Ready' },
  }[locale];

  const $ = (selector) => document.querySelector(selector);
  const NS = 'http://www.w3.org/2000/svg';
  const svgEl = (name, attrs = {}, parent = null) => {
    const node = document.createElementNS(NS, name);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, String(value));
    if (parent) parent.appendChild(node);
    return node;
  };
  const clamp01 = (value) => (value < 0 ? 0 : value > 1 ? 1 : value);
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = {
    linear: (t) => t,
    outCubic: (t) => 1 - (1 - t) ** 3,
    inOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : 1 - ((-2 * t + 2) ** 3) / 2),
    inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
    outBack: (t) => { const c1 = 1.6; const c3 = c1 + 1; return 1 + c3 * (t - 1) ** 3 + c1 * (t - 1) ** 2; },
  };
  const seg = (t, start, duration, fn = ease.linear) => fn(clamp01((t - start) / Math.max(1, duration)));

  const content = $('#content');
  const markSvg = $('#mark');
  const ruleSvg = $('#rule');
  const meta = $('.meta');
  const foot = $('.foot');
  const statusEl = $('.status');
  const statusText = $('.status .text');
  if (demo) document.body.classList.add('demo');
  $('.version').textContent = params.get('version') ? `v${params.get('version').replace(/^v/i, '')}` : '';
  const mods = Math.trunc(num('mods', 0));
  if (mods > 0) $('.mods').textContent = locale === 'zh' ? `已启用 ${mods} 个模组` : `${mods} ${mods === 1 ? 'mod' : 'mods'} enabled`;

  // ------------------------------------------------------------ wordmark
  // Monoline lettering on a 100-unit x-height, written stroke by stroke. The
  // capital S follows the S in the Shinawase dock mark.
  const A_BOWL = 'M100,-50 A50,50 0 0 0 0,-50 A50,50 0 0 0 100,-50';
  const ARCH = 'M0,-57 C0,-86 18,-100 41,-100 C64,-100 80,-86 80,-57 V0';
  const GLYPHS = [
    { x: 0, strokes: ['M90.4,-116.2 C82.3,-132.4 66.2,-142 46.8,-142 C22.6,-142 4.8,-127.5 4.8,-108.1 C4.8,-61.3 92,-82.3 92,-35.5 C92,-14.5 72.6,0 46.8,0 C25.8,0 8.1,-9.7 0,-27.4'] },
    { x: 130, strokes: ['M0,-150 V0', ARCH] },
    { x: 246, strokes: ['M0,-100 V0'], dot: [0, -136] },
    { x: 282, strokes: ['M0,-100 V0', ARCH] },
    { x: 398, strokes: [A_BOWL, 'M100,-100 V0'] },
    { x: 534, strokes: ['M0,-100 L31,0 L62,-96 L93,0 L124,-100'] },
    { x: 694, strokes: [A_BOWL, 'M100,-100 V0'] },
    { x: 830, strokes: ['M63.6,-81.8 C57.9,-93.2 46.6,-100 32.9,-100 C15.9,-100 3.4,-89.7 3.4,-76.1 C3.4,-43.2 64.8,-57.9 64.8,-25 C64.8,-10.2 51.1,0 32.9,0 C18.2,0 5.7,-6.8 0,-19.3'] },
    { x: 930, strokes: ['M0,-50 H100 A50,50 0 1 0 88.3,-17.9'] },
  ];
  const VIEW = { x: -12, y: -160, w: 1054, h: 172 };
  markSvg.setAttribute('viewBox', `${VIEW.x} ${VIEW.y} ${VIEW.w} ${VIEW.h}`);
  markSvg.style.height = `${(268 * VIEW.h) / VIEW.w}px`;
  const inkGroup = svgEl('g', { fill: 'none', stroke: 'var(--ink)', 'stroke-width': 7.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, markSvg);
  const strokes = [];
  for (const glyph of GLYPHS) {
    for (const d of glyph.strokes) {
      const path = svgEl('path', { d, transform: `translate(${glyph.x} 0)` }, inkGroup);
      strokes.push({ path, length: path.getTotalLength(), start: 0, duration: 0 });
    }
  }
  const DOT_R = 10;
  const dotGlyph = GLYPHS.find((glyph) => glyph.dot);
  const dot = svgEl('circle', { cx: dotGlyph.x + dotGlyph.dot[0], cy: dotGlyph.dot[1], r: 0, fill: 'var(--seal)' }, markSvg);

  // Each stroke gets time in proportion to its length; the next one starts a
  // moment before the pen lifts, like quick handwriting.
  const WRITE_START = 260;
  const WRITE_SPAN = 1500;
  const OVERLAP = 0.12;
  {
    const total = strokes.reduce((sum, stroke) => sum + stroke.length, 0);
    const budget = WRITE_SPAN / (1 - OVERLAP + OVERLAP / strokes.length);
    let cursor = WRITE_START;
    for (const stroke of strokes) {
      stroke.duration = Math.max(80, (budget * stroke.length) / total);
      stroke.start = cursor;
      cursor += stroke.duration * (1 - OVERLAP);
      stroke.path.setAttribute('stroke-dasharray', `${stroke.length} ${stroke.length * 2 + 10}`);
      stroke.path.setAttribute('stroke-dashoffset', String(stroke.length));
      stroke.path.style.opacity = '0';
    }
  }

  // ------------------------------------------------------------ rule
  // A hairline under the name. While ECHO loads, a short ink stroke travels
  // along it; when ECHO is ready the line fills in completely.
  const RULE_WIDTH = 448;
  ruleSvg.setAttribute('viewBox', `0 -2 ${RULE_WIDTH} 4`);
  ruleSvg.setAttribute('preserveAspectRatio', 'none');
  ruleSvg.style.height = '4px';
  ruleSvg.style.top = '174px';
  const hairline = svgEl('line', { x1: 0, x2: 0, y1: 0, y2: 0, stroke: 'var(--faint)', 'stroke-width': 1, 'shape-rendering': 'crispEdges' }, ruleSvg);
  const runner = svgEl('line', { x1: 0, x2: 0, y1: 0, y2: 0, stroke: 'var(--ink)', 'stroke-width': 1, 'shape-rendering': 'crispEdges', opacity: 0 }, ruleSvg);
  const fill = svgEl('line', { x1: 0, x2: 0, y1: 0, y2: 0, stroke: 'var(--ink)', 'stroke-width': 1, 'shape-rendering': 'crispEdges' }, ruleSvg);

  // ------------------------------------------------------------ status
  let stageKey = '';
  let swap = 0;
  const setStage = (key) => {
    const text = STAGES[key];
    if (!text || key === stageKey) return;
    const first = !stageKey;
    stageKey = key;
    statusEl.classList.toggle('ready', key === 'ready');
    clearTimeout(swap);
    if (first || reduced) { statusText.textContent = text; return; }
    statusText.classList.add('leaving');
    swap = setTimeout(() => {
      statusText.textContent = text;
      statusText.classList.remove('leaving');
    }, 220);
  };

  // ------------------------------------------------------------ timeline
  const INTRO_END = reduced ? 620 : 2400;
  const OUTRO_SPAN = reduced ? 260 : 820;
  const RUN_PERIOD = 1900;
  const timeline = { started: 0, idle: 0, outro: 0, dismiss: 0 };
  let introResolve;
  const introDone = new Promise((resolve) => { introResolve = resolve; });
  let raf = 0;

  const renderIntro = (t) => {
    // Hairline draws first, left to right, then the pen writes the name.
    const ruleIn = reduced ? seg(t, 0, 420, ease.outCubic) : seg(t, 60, 900, ease.inOutCubic);
    hairline.setAttribute('x2', (RULE_WIDTH * ruleIn).toFixed(2));
    for (const stroke of strokes) {
      const p = reduced ? 1 : seg(t, stroke.start, stroke.duration, ease.inOutSine);
      stroke.path.setAttribute('stroke-dashoffset', (stroke.length * (1 - p)).toFixed(2));
      stroke.path.style.opacity = (reduced ? t > 0 : t >= stroke.start) ? '1' : '0';
    }
    if (reduced) inkGroup.style.opacity = String(seg(t, 0, 420, ease.outCubic));
    const dotIn = reduced ? seg(t, 0, 420) : seg(t, 1700, 560, ease.outBack);
    dot.setAttribute('r', (DOT_R * dotIn).toFixed(2));
    const metaIn = reduced ? seg(t, 0, 420) : seg(t, 1500, 700, ease.outCubic);
    meta.style.opacity = String(metaIn);
    meta.style.transform = `translateY(${((1 - metaIn) * 4).toFixed(2)}px)`;
    const footIn = reduced ? seg(t, 0, 420) : seg(t, 1850, 550, ease.outCubic);
    foot.style.opacity = String(footIn);
  };

  const renderIdle = (now) => {
    if (reduced || !timeline.idle || timeline.outro) { runner.setAttribute('opacity', '0'); return; }
    const appear = seg(now, timeline.idle, 500, ease.outCubic);
    const phase = ((now - timeline.idle) % RUN_PERIOD) / RUN_PERIOD;
    const head = ease.inOutSine(clamp01(phase / 0.82));
    const length = 72;
    const x2 = lerp(0, RULE_WIDTH + length, head);
    runner.setAttribute('x1', Math.max(0, x2 - length).toFixed(2));
    runner.setAttribute('x2', Math.min(RULE_WIDTH, x2).toFixed(2));
    runner.setAttribute('opacity', (0.55 * appear * (phase < 0.82 ? 1 : 0)).toFixed(3));
  };

  // Outro: the line completes, the seal dot nods, and the card empties out.
  const renderOutro = (now) => {
    const t = now - timeline.outro;
    const done = reduced ? 1 : seg(t, 0, 380, ease.inOutCubic);
    fill.setAttribute('x2', (RULE_WIDTH * done).toFixed(2));
    const nod = reduced ? 0 : Math.sin(Math.PI * seg(t, 200, 320));
    dot.setAttribute('r', (DOT_R * (1 + 0.28 * nod)).toFixed(2));
    const fade = reduced ? seg(t, 0, OUTRO_SPAN, ease.inOutCubic) : seg(t, 420, OUTRO_SPAN - 420, ease.inOutCubic);
    content.style.opacity = String(1 - fade);
    content.style.transform = `translateY(${(-6 * fade).toFixed(2)}px)`;
  };

  const renderDismiss = (now) => {
    content.style.opacity = String(1 - seg(now - timeline.dismiss, 0, 200, ease.outCubic));
  };

  // ?demo=1&at=<ms> freezes the timeline for design review (&outro-at=<ms> inside the outro).
  let frozenAt = demo ? num('at', NaN) : NaN;
  const frameTick = (now) => {
    raf = 0;
    if (!timeline.started) return;
    if (Number.isFinite(frozenAt)) now = timeline.started + frozenAt;
    const t = now - timeline.started;
    renderIntro(timeline.outro ? Math.max(INTRO_END, Math.min(t, timeline.outro - timeline.started)) : t);
    if (!timeline.idle && t >= INTRO_END) timeline.idle = timeline.started + INTRO_END;
    renderIdle(now);
    if (timeline.outro) renderOutro(now);
    if (timeline.dismiss) renderDismiss(now);
    raf = requestAnimationFrame(frameTick);
  };

  // ------------------------------------------------------------ API
  const later = (ms) => new Promise((resolve) => setTimeout(resolve, Math.max(0, ms)));
  const api = {
    start() {
      if (timeline.started) return true;
      timeline.started = performance.now();
      setStage(stageKey || 'boot');
      setTimeout(introResolve, INTRO_END);
      raf = requestAnimationFrame(frameTick);
      return true;
    },
    // Resolves once the intro has fully played.
    whenIntroDone() {
      if (!timeline.started) api.start();
      return introDone.then(() => true);
    },
    stage(key) {
      if (!stageKey || stageKey !== 'ready') setStage(String(key || ''));
      return true;
    },
    // Resolves when the card has emptied out and ECHO should take over.
    async outro() {
      if (!timeline.started) api.start();
      await introDone;
      if (!timeline.outro) {
        setStage('ready');
        timeline.outro = performance.now();
        if (!raf) raf = requestAnimationFrame(frameTick);
      }
      await later(timeline.outro + OUTRO_SPAN - performance.now());
      return true;
    },
    // A short beat so ECHO's window has painted before the card goes away.
    async finish() {
      if (!timeline.outro) await api.outro();
      await later(160);
      return true;
    },
    async dismiss() {
      if (!timeline.started) { content.style.opacity = '0'; return true; }
      if (!timeline.dismiss) timeline.dismiss = performance.now();
      if (!raf) raf = requestAnimationFrame(frameTick);
      await later(220);
      return true;
    },
  };
  Object.freeze(api);
  Object.defineProperty(window, 'shinawaseSplash', { value: api });

  if (demo && Number.isFinite(frozenAt)) {
    api.start();
    setStage('ui');
    const outroAt = num('outro-at', NaN);
    if (Number.isFinite(outroAt)) {
      timeline.outro = timeline.started + INTRO_END + 600;
      setStage('ready');
      frozenAt = INTRO_END + 600 + outroAt;
    }
  } else if (demo) {
    const run = async () => {
      api.start();
      setTimeout(() => api.stage('echo'), 1200);
      setTimeout(() => api.stage('ui'), 3000);
      await later(4800);
      await api.outro();
      await api.finish();
      setTimeout(() => location.reload(), 1400);
    };
    addEventListener('load', () => { void run(); }, { once: true });
  }
})();
</script>
</body>
</html>
